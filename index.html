<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#111827" />
<title>Overload</title>
<link rel="manifest" href="manifest.webmanifest" />
<style>
:root{--bg:#0b1020;--card:#151c2f;--muted:#98a2b3;--text:#f8fafc;--accent:#60a5fa;--good:#34d399;--warn:#fbbf24;--line:#28324a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#090e1b,#10182b);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:20px 16px 90px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:28px;font-weight:850;letter-spacing:-.7px}.brand span{color:var(--accent)}button,select,input{font:inherit}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0 18px}.tab{background:#11182a;border:1px solid var(--line);color:var(--muted);padding:10px 6px;border-radius:12px;cursor:pointer}.tab.active{color:white;border-color:var(--accent);background:#17213a}.card{background:rgba(21,28,47,.96);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 10px 30px rgba(0,0,0,.15)}h1,h2,h3,p{margin-top:0}h2{font-size:20px;margin-bottom:5px}.muted{color:var(--muted)}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#0f172a;border:1px solid var(--line);color:#cbd5e1;font-size:12px}.exercise-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.target{color:var(--good);font-weight:700;margin:7px 0}.sets{display:grid;grid-template-columns:76px 1fr 1fr;gap:7px;align-items:center;margin-top:10px}.sets .head{font-size:12px;color:var(--muted);text-align:center}.sets input{width:100%;background:#0e1527;color:white;border:1px solid #33405b;border-radius:10px;padding:10px;text-align:center}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:750;cursor:pointer}.primary{background:var(--accent);color:#07101f}.secondary{background:#222c43;color:white;border:1px solid #34415d}.danger{background:#3b1820;color:#fecaca;border:1px solid #6b2430}.row{display:flex;gap:8px;flex-wrap:wrap}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0f172a;border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}.hidden{display:none}.footer{position:fixed;bottom:0;left:0;right:0;background:rgba(8,13,25,.93);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:9px 12px}.footer-inner{max-width:760px;margin:auto;display:flex;gap:8px}.footer button{flex:1}.notice{padding:10px 12px;border-radius:12px;background:#102238;border:1px solid #244a70;color:#bfdbfe;margin:10px 0}.history-item{border-top:1px solid var(--line);padding:10px 0}.history-item:first-child{border-top:0}.daypicker{width:100%;padding:11px;background:#10182a;color:white;border:1px solid var(--line);border-radius:12px}.tiny{font-size:12px}.check{color:var(--good);font-weight:800}
</style>
</head>
<body><div class="wrap">
<header><div><div class="brand"><span>OVER</span>LOAD</div><div class="muted">Progressive overload without the bookkeeping.</div></div><span class="pill">V1</span></header>
<div class="tabs"><button class="tab active" data-view="workout">Workout</button><button class="tab" data-view="program">Program</button><button class="tab" data-view="history">History</button><button class="tab" data-view="progress">Progress</button></div>
<section id="workout" class="view"></section><section id="program" class="view hidden"></section><section id="history" class="view hidden"></section><section id="progress" class="view hidden"></section>
</div>
<div class="footer"><div class="footer-inner"><button class="btn secondary" id="timerBtn">Rest 90s</button><button class="btn primary" id="saveBtn">Save Workout</button></div></div>
<script>
const PROGRAM=[
{name:'Day 1 — Chest + Triceps',ex:[
['Barbell Bench Press',3,6,10,5,'lb'],['Incline DB Press',3,8,12,5,'lb each'],['Dumbbell Fly',3,10,15,5,'lb each'],['DB Squeeze Press',2,10,15,5,'lb each'],['Cable Triceps Pushdown',3,10,15,5,'lb'],['EZ-Bar Skull Crusher',3,8,12,5,'lb + bar']]},
{name:'Day 2 — Back + Biceps',ex:[
['Apollo Lat Pulldown',4,8,12,5,'lb'],['Chest-Supported DB Row',4,8,12,5,'lb each'],['Seated Cable Row',3,10,12,5,'lb'],['Straight-Arm Cable Pulldown',2,12,15,5,'lb'],['Rear-Delt Cable Fly',3,12,20,5,'lb'],['EZ Curl',3,8,12,5,'lb + bar'],['Preacher Curl',3,10,15,5,'lb + bar'],['DB Hammer Curl',2,10,15,5,'lb each']]},
{name:'Day 3 — Legs + Core',ex:[
['Bulgarian Split Squat',3,8,12,5,'lb each'],['Apollo Leg Press',3,10,15,10,'lb'],['Leg Extension',3,12,15,5,'lb'],['Leg Curl',4,10,15,5,'lb'],['DB Step-Up',2,10,12,5,'lb each'],['Standing Calf Raise',4,10,15,5,'lb'],['Pallof Press',3,10,15,5,'lb'],['Dead Bug',3,8,12,0,'bodyweight']]},
{name:'Day 4 — Shoulders + Arms',ex:[
['Seated Back-Supported DB Shoulder Press',3,8,12,5,'lb each'],['DB Lateral Raise',4,12,20,5,'lb each'],['Cable Lateral Raise',2,12,20,5,'lb'],['Reverse Fly',3,12,20,5,'lb'],['EZ Curl',3,8,12,5,'lb + bar'],['Rope Hammer Curl',2,10,15,5,'lb'],['Cable Pressdown',3,10,15,5,'lb'],['Overhead Cable Triceps Extension',2,10,15,5,'lb']]},
{name:'Day 5 — Upper Hypertrophy',ex:[
['Incline DB Press',3,8,12,5,'lb each'],['Lat Pulldown — Alternate Grip',3,8,12,5,'lb'],['Flat DB Press',3,10,12,5,'lb each'],['Chest-Supported DB Row',3,10,12,5,'lb each'],['Cable Fly',2,12,15,5,'lb'],['Straight-Arm Pulldown',2,12,15,5,'lb'],['DB Lateral Raise',3,15,20,5,'lb each'],['Preacher Curl',2,12,15,5,'lb + bar'],['Pressdown',2,12,15,5,'lb']]}
];
const SEED={day:0,date:'2026-10-03',duration:'45–60 min',results:{
'Barbell Bench Press':{w:135,r:[8,8,8]},'Incline DB Press':{w:35,r:[10,10,10]},'Dumbbell Fly':{w:20,r:[12,12,12]},'DB Squeeze Press':{w:25,r:[15,15]},'Cable Triceps Pushdown':{w:70,r:[15,15,15]},'EZ-Bar Skull Crusher':{w:20,r:[10,10,10],note:'+ bar weight'}
}};
let history=JSON.parse(localStorage.getItem('overloadHistory')||'null')||[SEED];let day=Number(localStorage.getItem('overloadDay')||1);
function lastFor(name){for(let i=history.length-1;i>=0;i--){let x=history[i].results?.[name];if(x)return x}return null}
function recommendation(e,last){let [name,sets,min,max,inc,unit]=e;if(!last)return 'Establish a clean baseline at 1–2 RIR.';let reps=last.r||[];if(reps.length>=sets && reps.every(x=>x>=max) && inc)return `Increase to ${last.w+inc} ${unit}; target ${min}–${Math.min(min+2,max)} reps/set.`;let total=reps.reduce((a,b)=>a+b,0);return `Keep ${last.w} ${unit}; beat ${total} total reps while staying ≤ ${max}/set.`}
function renderWorkout(){let p=PROGRAM[day];let html=`<div class="card"><select class="daypicker" id="daypick">${PROGRAM.map((x,i)=>`<option value="${i}" ${i==day?'selected':''}>${x.name}</option>`).join('')}</select><div class="notice">Designed for <b>45–60 minutes</b>. Most working sets stop at <b>1–2 RIR</b>.</div></div>`;
p.ex.forEach((e,idx)=>{let [name,sets,min,max,inc,unit]=e,l=lastFor(name);html+=`<div class="card exercise" data-name="${name}"><div class="exercise-head"><div><h2>${idx+1}. ${name}</h2><div class="muted">${sets} sets × ${min}–${max} • ${unit}</div></div><span class="pill">1–2 RIR</span></div>${l?`<div class="tiny muted">Last: <b style="color:white">${l.w} ${unit}</b> × ${l.r.join(' / ')}</div>`:''}<div class="target">🎯 ${recommendation(e,l)}</div><div class="sets"><div></div><div class="head">WEIGHT</div><div class="head">REPS</div>${Array.from({length:sets},(_,s)=>`<div class="muted">Set ${s+1}</div><input class="w" type="number" inputmode="decimal" value="${l?.w??''}" placeholder="lb"><input class="r" type="number" inputmode="numeric" placeholder="${min}-${max}">`).join('')}</div></div>`});document.querySelector('#workout').innerHTML=html;document.querySelector('#daypick').onchange=e=>{day=+e.target.value;localStorage.setItem('overloadDay',day);renderAll()}}
function renderProgram(){document.querySelector('#program').innerHTML=PROGRAM.map(p=>`<div class="card"><h2>${p.name}</h2>${p.ex.map(e=>`<div class="history-item"><b>${e[0]}</b><div class="muted">${e[1]} × ${e[2]}–${e[3]}</div></div>`).join('')}</div>`).join('')}
function renderHistory(){document.querySelector('#history').innerHTML=`<div class="card"><h2>Workout History</h2>${[...history].reverse().map(h=>`<div class="history-item"><b>${h.date} — ${PROGRAM[h.day]?.name||'Workout'}</b>${Object.entries(h.results||{}).map(([n,x])=>`<div class="muted">${n}: ${x.w} × ${x.r.join('/')}</div>`).join('')}</div>`).join('')}</div>`}
function renderProgress(){let total=history.length;let exCount=history.reduce((a,h)=>a+Object.keys(h.results||{}).length,0);let prs={};history.forEach(h=>Object.entries(h.results||{}).forEach(([n,x])=>{let score=x.w*Math.max(...x.r);if(!prs[n]||score>prs[n].score)prs[n]={score,w:x.w,r:Math.max(...x.r)}}));document.querySelector('#progress').innerHTML=`<div class="summary"><div class="stat"><b>${total}</b><span class="muted">workouts</span></div><div class="stat"><b>${exCount}</b><span class="muted">logged lifts</span></div><div class="stat"><b>${Object.keys(prs).length}</b><span class="muted">tracked moves</span></div></div><div class="card"><h2>Best Logged Sets</h2>${Object.entries(prs).map(([n,x])=>`<div class="history-item"><b>${n}</b><div class="muted">${x.w} × ${x.r}</div></div>`).join('')}</div>`}
function renderAll(){renderWorkout();renderProgram();renderHistory();renderProgress()}
function saveWorkout(){let results={};document.querySelectorAll('.exercise').forEach(card=>{let name=card.dataset.name,ws=[...card.querySelectorAll('.w')].map(x=>+x.value),rs=[...card.querySelectorAll('.r')].map(x=>+x.value);let valid=rs.filter(Boolean);if(valid.length)results[name]={w:ws.find(Boolean)||0,r:valid}});if(!Object.keys(results).length){alert('Enter at least one completed set first.');return}history.push({day,date:new Date().toISOString().slice(0,10),results});localStorage.setItem('overloadHistory',JSON.stringify(history));alert('Workout saved. Next targets updated automatically.');renderAll()}
let timer=null,remaining=90;document.querySelector('#timerBtn').onclick=()=>{if(timer){clearInterval(timer);timer=null;remaining=90;document.querySelector('#timerBtn').textContent='Rest 90s';return}remaining=90;document.querySelector('#timerBtn').textContent=`Rest ${remaining}s`;timer=setInterval(()=>{remaining--;document.querySelector('#timerBtn').textContent=`Rest ${remaining}s`;if(remaining<=0){clearInterval(timer);timer=null;document.querySelector('#timerBtn').textContent='Rest 90s';alert('Rest complete.')}} ,1000)};document.querySelector('#saveBtn').onclick=saveWorkout;
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));document.querySelector('#'+t.dataset.view).classList.remove('hidden')});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});renderAll();
</script></body></html>
